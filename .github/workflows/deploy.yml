name: Deploy App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

concurrency:
  group: main-push
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --prefer-offline || npm install

      - name: Build
        working-directory: app
        run: npm run build

      - name: Prepare docs/ folder
        run: |
          # Clean previous build artifacts (keep structure)
          rm -rf docs/assets
          mkdir -p docs
          # Copy new build
          cp -r app/dist/* docs/
          # Ensure .nojekyll exists for GitHub Pages
          touch docs/.nojekyll

      - name: Commit & Push to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull latest changes first (handle race with sync-courses workflow)
          git pull --rebase || { echo "Remote has new changes, continuing anyway"; }
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: auto-deploy built app to docs/ [skip ci]"
            git push
          fi
