name: LLM Pipeline — Incremental Course Enhancement

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Manual trigger
    inputs:
      repo:
        description: 'Target repo (civil|history|mech|psych|physics|all)'
        required: false
        default: 'all'
      batch_size:
        description: 'Courses per run (default 20)'
        required: false
        default: '20'

env:
  PYTHONPATH: ${{ github.workspace }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repos
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout all target repos
        run: |
          cd ${{ github.workspace }}
          # Clone all target repos if not already present
          for repo in \
            civil-bootcamp \
            HKU-Harvard-History-Self-Study \
            mech-Eng-Bootcamp \
            psych-self-study-hku \
            PhysicsSelfStudy; do
            if [ ! -d "$repo" ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/yip-lgtm/$repo.git
            else
              (cd $repo && git pull)
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx requests

      - name: Run pipeline on Civil Bootcamp
        if: inputs.repo == 'civil' || inputs.repo == 'all' || github.event_name == 'schedule'
        run: |
          python3 _pipeline/director_pipeline.py \
            --repo civil-bootcamp \
            --batch ${{ inputs.batch_size || '20' }}

      - name: Run pipeline on History
        if: inputs.repo == 'history' || inputs.repo == 'all' || github.event_name == 'schedule'
        run: |
          python3 _pipeline/director_pipeline.py \
            --repo HKU-Harvard-History-Self-Study \
            --batch ${{ inputs.batch_size || '20' }}

      - name: Run pipeline on MechEng
        if: inputs.repo == 'mech' || inputs.repo == 'all' || github.event_name == 'schedule'
        run: |
          python3 _pipeline/director_pipeline.py \
            --repo mech-Eng-Bootcamp \
            --batch ${{ inputs.batch_size || '20' }}

      - name: Run pipeline on Psych
        if: inputs.repo == 'psych' || inputs.repo == 'all' || github.event_name == 'schedule'
        run: |
          python3 _pipeline/director_pipeline.py \
            --repo psych-self-study-hku \
            --batch ${{ inputs.batch_size || '20' }}

      - name: Run pipeline on Physics
        if: inputs.repo == 'physics' || inputs.repo == 'all' || github.event_name == 'schedule'
        run: |
          python3 _pipeline/director_pipeline.py \
            --repo PhysicsSelfStudy \
            --branch master \
            --batch ${{ inputs.batch_size || '20' }}

      - name: Push all changes
        run: |
          cd ${{ github.workspace }}
          for repo in \
            civil-bootcamp \
            HKU-Harvard-History-Self-Study \
            mech-Eng-Bootcamp \
            psych-self-study-hku \
            PhysicsSelfStudy; do
            (cd $repo && \
              git config user.email "pipeline@vibe-study-bootcamp" && \
              git config user.name "LLM Pipeline Bot" && \
              if [ -n "$(git status --porcelain)" ]; then \
                git add -A && \
                git commit -m "[CI] LLM pipeline update $(date -u +%Y-%m-%dT%H:%M)" && \
                git push https://${{ secrets.GH_TOKEN }}@github.com/yip-lgtm/$repo.git HEAD; \
              fi)
          done

      - name: Report
        run: |
          echo "Pipeline run complete at $(date)"
          echo "Modified repos pushed."
